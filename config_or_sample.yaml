address_linking:
  corroboration_modifiers:
    tin_co_membership:
      description: Rate-file TIN co-membership entity corroboration (modifier, not
        an independent group)
  fuzzy_matching:
    city_similarity_threshold: 90.0
    street_similarity_threshold: 85.0
  independence_groups:
    group_1_nppes:
      description: Shared upstream CMS NPPES dissemination database and NPI Registry
        API
      sources:
      - nppes_primary
      - nppes_secondary
      - nppes_mailing
      - npi_registry_api
    group_2_cms:
      description: CMS provider enrollment and Medicare claims data
      sources:
      - cms_doctors_clinicians
      - medicare_public
    group_3_state_payer:
      description: State licensing board and payer network provider directory
      sources:
      - ca_medical_board
      - healthnet_directory
  probable_threshold: 0.4
  scoring_weights:
    name_location_hint: 0.05
    recency_currency: 0.15
    source_agreement: 0.35
    source_trust: 0.25
    taxonomy_plausibility: 0.05
    tin_corroboration: 0.15
  sources:
    cms_doctors_clinicians:
      base_weight: 0.25
      enabled: true
      trust_tier: HIGH
    healthnet_directory:
      base_weight: 0.2
      enabled: false
      trust_tier: HIGH
    medicare_public:
      base_weight: 0.15
      enabled: true
      trust_tier: MODERATE
    npi_registry_api:
      base_weight: 0.25
      cache_enabled: true
      enabled: true
      rate_limit_per_sec: 5
      trust_tier: HIGH
    nppes_mailing:
      base_weight: 0.05
      enabled: true
      trust_tier: LOW
    nppes_primary:
      base_weight: 0.25
      enabled: true
      trust_tier: HIGH
    nppes_secondary:
      base_weight: 0.15
      enabled: true
      trust_tier: MODERATE
  tin_corroboration_min_npis: 2
  verification_threshold: 0.7
classifier:
  known_hmo_families:
  - WholeCare
  - SmartCare
  - Salud
  - Full Network
  - CalChoice
  - CommunityCare
  - HMO
  metal_tiers:
  - Platinum
  - Gold
  - Silver
  - Bronze
  min_confidence_threshold: 0.8
  network_tokens:
    epo:
    - EPO
    - EXCLUSIVE PROVIDER ORGANIZATION
    hmo:
    - HMO
    - HEALTH MAINTENANCE ORGANIZATION
    pos:
    - POS
    - POINT OF SERVICE
    ppo:
    - PPO
    - PREFERRED PROVIDER ORGANIZATION
  random_seed: 42
cost_effectiveness:
  min_peer_group_size: 5
  outlier_method: IQR
  outlier_multiplier: 1.5
original_input_sources:
  ambetter_index: /home/srinivas/Downloads/2026-09-28_ambetter_index.json
  fidelis_index: /home/srinivas/Downloads/2026-09-28_fidelis_index.json
  healthnet_ca_rate_file: /home/srinivas/Downloads/2026-09-30_centene-management-company-llc_healthnet-ca_in-network.json
  healthnet_index: /home/srinivas/Downloads/2026-09-30_healthnet_index.json
  qualchoice_index: /home/srinivas/Downloads/2026-09-28_qualchoice_index.json
parser:
  chunk_size: 10000
  ijson_backend: yajl2_c
paths:
  data_dir: data
  docs_dir: docs
  index_dir: data/index
  interim_dir: data/interim
  output_dir: data/output
  raw_dir: data/raw
  reference_dir: data/reference
  reports_dir: data/output/reports
project:
  description: Production-grade PTD Curation Pipeline for Centene Provider Rates
  name: ptd_pipeline
  version: 1.0.0
rate_extraction:
  tie_break_hierarchy:
  - drop_null_zero_negative
  - drop_expired
  - prefer_dollar_over_percentage
  - prefer_negotiated_over_fee_schedule
  - match_billing_class_to_npi_type
  - latest_expiration_date
  - median_tiebreaker
reference_files:
  hilabs_workbook: data/reference/Rate_Benchmarking_Individual_Weights_Hackathon.xlsx
  manifest: data/reference/manifest.sha256
  nppes_zip: data/reference/NPPES_Data_Dissemination_October_2026_V2.zip
  nucc_taxonomy: data/reference/nucc_taxonomy.csv
scope:
  allowed_npi_types:
  - 1
  - 2
  payer: Centene
  rate_file_pattern: '*healthnet-or*.json'
  target_market: GROUP
  target_network: PPO
  target_state: OR
system:
  duckdb_memory_limit: 2GB
  memory_limit_mb: 2048
  parquet_row_group_size: 50000
  polars_streaming: true
  xlsx_constant_memory: true
